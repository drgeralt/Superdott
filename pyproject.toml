[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "UP"]
ignore = ["D100", "D104"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa Depends() como default de argumento — comportamento esperado
"src/api/routers/*.py" = ["B008"]
# Testes podem usar assert, fixtures com magic values, etc.
"tests/*.py" = ["S101", "S105", "S106"]

[tool.ruff]
exclude = [".venv", "__pycache__", ".pytest_cache", ".ruff_cache", "migrations"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "migrations", "__pycache__"]
targets = ["src"]
skips = ["B101"]  # Ignora uso de assert (comum em testes)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Ignora avisos esperados de libs externas
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", ".venv/*", "migrations/*"]
