[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "S",
    "UP",
]
ignore = ["D100", "D104"] # Ignorar docstrings em módulos/packages se preferir

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/api/routers/*.py" = ["B008"]

[tool.bandit]
exclude_dirs = ["src/generated"]