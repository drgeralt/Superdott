services:
  db:
    image: ankane/pgvector:latest
    container_name: superdott_db
    mem_limit: 512m
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-superdott}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-superdott}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: superdott_api
    mem_limit: 1g
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # MAPEAMENTO CORRIGIDO: Mapeia apenas a pasta do backend para /app dentro do container
      - ./backend:/app:cached
    working_dir: /app
    command: >
      sh -c "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Adicionado -sS para o curl não poluir os logs do docker com progresso de download
      test: [ "CMD", "curl", "-fIsS", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: superdott_frontend
    mem_limit: 512m
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Corrigido para garantir que o mapeamento bata com o WORKDIR interno do frontend
      - ./frontend:/app:z

volumes:
  postgres_data:
