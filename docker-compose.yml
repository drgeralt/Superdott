services:
  db:
    image: ankane/pgvector:latest
    container_name: superdott_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-superdott}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d superdott"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: superdott_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app:z
    command: >
       sh -c "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: superdott_frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src:z

volumes:
  postgres_data:
